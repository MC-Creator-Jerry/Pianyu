<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理控制台 · 片屿</title>
<script>try{var p=localStorage.getItem('pianyu-theme')||'auto';var t=(p==='light'||p==='dark')?p:((window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
<link rel="icon" href="assets/favicon.svg?v=6" type="image/svg+xml">
<link rel="stylesheet" href="assets/pianyu.css?v=20260930">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img class="logo" src="assets/favicon.svg?v=6" alt="片屿">
      片屿<span class="sub">PIANYU</span>
    </a>
    <div class="spacer"></div>
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="map.html">岛图</a>
      <a href="admin.html">上新</a>
      <a href="creator.html">创作岛</a>
      <a href="manage.html" class="on">管理</a>
    </nav>
    <div class="hdr-right" id="hdrRight"></div>
  </div>
</header>

<main class="wrap">
  <!-- 未登录：管理员登录 -->
  <section id="gate" class="gate" style="display:none">
    <div class="ic">🛡️</div>
    <h2>管理员登录</h2>
    <p>这是片屿的内容管理控制台，用于查看和处理岛民举报。使用管理员账户登录后即可进入。</p>
    <button class="btn primary" id="adminLogin">以管理员身份进入</button>
  </section>

  <!-- 已登录：控制台 -->
  <section id="console" style="display:none">
    <div class="panel" id="reportPanel">
      <h2>举报处理（<span id="reportCount">0</span>）</h2>
      <p class="hint">岛民提交的举报会在此排队，由管理员核实后「已处理」或「删除内容」。</p>
      <div id="reportList" class="report-list"></div>
    </div>

    <div class="panel">
      <h2>会话</h2>
      <p class="hint">当前以管理员账户登录。退出后需重新登录才能查看举报。</p>
      <button class="btn" id="adminLogout">退出管理员登录</button>
    </div>
  </section>
</main>

<footer class="site-footer"><div class="wrap"><span>© 片屿 · PIANYU</span></div></footer>

<script src="assets/pianyu.js?v=20260937"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);

  async function boot() {
    const admin = await PY.isAdmin();
    if (!admin) { $('gate').style.display = 'block'; return; }
    $('console').style.display = 'block';
    await PY.renderReports($('reportList'), $('reportCount'));
  }

  $('adminLogin').onclick = async () => {
    const { res } = await PY.api('/api/admin/login', { method: 'POST' });
    if (res.ok) location.reload();
    else alert('登录失败：' + res.status);
  };

  $('adminLogout').onclick = async () => {
    await PY.api('/api/admin/logout', { method: 'POST' });
    location.reload();
  };

  boot();
  PY.mountHeader();
})();
</script>
  <script src="/assets/scroll-keys.js?v=20260926c" defer></script>
</body>
</html>
