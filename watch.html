<main class="wrap" id="main">

  <!-- 管理员举报审核条（仅带 ?report=<id> 且管理员/站长登录时显示） -->
  <div class="report-review" id="reportReview" style="display:none">
    <div class="rr-card">
      <div class="rr-head">🛡️ 举报审核<span class="rr-close" id="rrClose" title="返回面板">×</span></div>

      </div>

  <div class="player-wrap">
    <div id="videoHost"></div>

  <div class="player-mode" id="playerMode" style="display:none">

    <div id="desc" class="watch-desc"></div>

    <div class="watch-actions" id="watchActions">
      <button id="likeBtn" class="act-btn" type="button"><span class="ic">👍</span> <span id="likeCount">0</span></button>
      <button id="reportBtn" class="act-btn ghost" type="button">🚩 举报</button>

  <section class="yulun">

      <div><button id="cmSend" class="btn primary">发表屿论</button> <span id="cmMsg" class="dm-hint"></span></div>
    </div>
    <div id="cmList" class="cm-list"></div>

<script src="assets/pianyu.js?v=20261001a"></script>
<script>
(function () {
  const id = PY.qs('id');
  const host = document.getElementById('videoHost');
  const dmLayer = document.getElementById('dmLayer');
  const dmBar = document.getElementById('dmBar');

  PY.showSsoNotice();
  const hdrReady = PY.mountHeader();
  initReportReview();

  if (!id) {
    document.querySelector('.player-wrap').style.display = 'none';
    dmBar.style.display = 'none';
    document.getElementById('title').textContent = '缺少视频 ID';
    return;
  }

  /* ---------------- 登录身份 ---------------- */
  let me = null;
  hdrReady.then(async () => {
    me = await PY.user.load();
    if (me) {
      document.getElementById('cmNameRow').style.display = 'none';
      document.getElementById('cmWhoRow').style.display = 'flex';
      document.getElementById('cmWho').textContent = me.name || me.login || '岛民';
    }
  });

  /* ---------------- 定点屿论 (danmaku) ---------------- */
  const DM_LANES = 5, DM_LANE_H = 28, DM_TOP = 8;
  let danmaku = [], dmShown = Object.create(null), dmEnabled = true, dmIndex = 0;

  function spawnDm(d) {
    if (!dmEnabled) return;
    const el = document.createElement('div');
    el.className = 'dm-item';
    el.textContent = d.text;
    if (d.color) el.style.color = d.color;
    el.style.top = (DM_TOP + (dmIndex % DM_LANES) * DM_LANE_H) + 'px';
    dmIndex++;
    const dur = Math.min(16, 7 + d.text.length * 0.12);
    el.style.animationDuration = dur + 's';
    el.addEventListener('animationend', () => el.remove());
    dmLayer.appendChild(el);
  }

  /* ---------------- load ---------------- */
  let video = null;
  let currentVideo = null, currentPr = null;
  let dmLoopRunning = false;
  let playerMode = (function () { try { return localStorage.getItem('pianyu-playmode') === 'direct' ? 'direct' : 'pianyu'; } catch (e) { return 'pianyu'; } })();

  // 把任意外链解析成「可播放」形式：
  //  - 媒体直链（.mp4 等）→ file 模式（<video>）
  //  - B站/YouTube 等网页 → 转成官方播放器嵌入地址（原 www.bilibili.com 观看页拒绝被 iframe 嵌入）
  //  - 其它网页 → 直接 iframe 嵌入
  // 同时标记 host 与 blockedCN（境内网络通常无法直连），供渲染兜底使用。
  function hostOf(u) { try { return new URL(u).hostname.toLowerCase(); } catch (e) { return ''; } }
  // 这些平台在中国大陆网络通常被拦截 / 无法直连（GFW）
  const BLOCKED_CN = [
    /(^|\.)youtube\.com$/, /(^|\.)youtu\.be$/, /(^|\.)youtube-nocookie\.com$/,
    /(^|\.)vimeo\.com$/, /(^|\.)twitter\.com$/, /(^|\.)x\.com$/,
    /(^|\.)facebook\.com$/, /(^|\.)instagram\.com$/, /(^|\.)tiktok\.com$/,
    /(^|\.)dailymotion\.com$/, /(^|\.)twitch\.tv$/, /(^|\.)netflix\.com$/,
    /(^|\.)reddit\.com$/, /(^|\.)medium\.com$/, /(^|\.)vk\.com$/,
  ];
  function blockedInCN(host) { return BLOCKED_CN.some((re) => re.test(host)); }

  function resolvePlayer(v) {
    const raw = (v && v.url) || '';
    if (/\.(mp4|webm|ogg|ogv|mov|m4v|m3u8)([#?]|$)/i.test(raw)) {
      return { mode: 'file', url: raw, raw, host: hostOf(raw), blockedCN: false };
    }
    let m;
    if ((m = raw.match(/bilibili\.com\/video\/(BV[\w]+)/i))) {
      const u = 'https://player.bilibili.com/player.html?bvid=' + m[1] + '&high_quality=1&autoplay=0&danmaku=0';
      return { mode: 'embed', url: u, raw, host: 'bilibili.com', blockedCN: false };
    }
    if ((m = raw.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w-]{6,})/i))) {
      return { mode: 'embed', url: 'https://www.youtube.com/embed/' + m[1], raw, host: 'youtube.com', blockedCN: true };
    }
    const h = hostOf(raw);
    return { mode: 'embed', url: raw, raw, host: h, blockedCN: blockedInCN(h) };
  }

  // 嵌入播放器未能加载（被网络拦截 / 平台限制）时的兜底卡片：
  // 提供「在新标签打开原视频」与「仍要尝试加载」。
  function renderEmbedFallback(raw, hostLabel, proactive) {
    const wrap = document.createElement('div');
    wrap.className = 'player-blocked';
    const note = proactive
      ? '该内容来自境外平台（' + PY.esc(hostLabel) + '），中国大陆网络通常会拦截或无法直连。'
      : '嵌入播放器未能加载，可能是当前网络拦截了该平台，或平台限制了外部嵌入。';
    wrap.innerHTML =
      '<div class="pb-icon">🌐🚫</div>' +
      '<div class="pb-title">无法在此播放</div>' +
      '<div class="pb-desc">' + note + '你可以在下方「在新标签打开」直接前往原平台观看。</div>' +
      '<div class="pb-actions">' +
        '<a class="btn primary" id="pbOpen" target="_blank" rel="noopener noreferrer">在新标签打开原视频 ↗</a>' +
        '<button class="btn ghost" id="pbTry" type="button">仍要尝试在此加载</button>' +
      '</div>';
    wrap.querySelector('#pbOpen').href = raw;
    wrap.querySelector('#pbTry').onclick = () => {
      const f = document.createElement('iframe');
      f.className = 'player-iframe';
      f.src = raw;
      f.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
      f.setAttribute('allowfullscreen', '');
      f.setAttribute('referrerpolicy', 'no-referrer');
      let loaded = false;
      f.addEventListener('load', () => { loaded = true; });
      const t = setTimeout(() => {
        if (!loaded && f.isConnected) f.replaceWith(renderEmbedFallback(raw, hostLabel, false));
      }, 12000);
      f.addEventListener('load', () => clearTimeout(t));
      wrap.replaceWith(f);
    };
    return wrap;
  }

  // 渲染嵌入：先尝试 iframe；若是境外被墙平台则直接给兜底卡片；
  // 其余平台若 12s 内未加载（被拦截 / 受限）则换成兜底卡片。
  function mountEmbed(pr, container) {
    if (pr.blockedCN) {
      container.appendChild(renderEmbedFallback(pr.raw, pr.host, true));
      return;
    }
    const f = document.createElement('iframe');
    f.className = 'player-iframe';
    f.src = pr.url;
    f.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
    f.setAttribute('allowfullscreen', '');
    f.setAttribute('referrerpolicy', 'no-referrer');
    let loaded = false;
    f.addEventListener('load', () => { loaded = true; });
    const t = setTimeout(() => {
      if (!loaded && f.isConnected) f.replaceWith(renderEmbedFallback(pr.raw, pr.host, false));
    }, 12000);
    f.addEventListener('load', () => clearTimeout(t));
    container.appendChild(f);
  }

  function fmtTime(t) {
    if (!isFinite(t) || t < 0) t = 0;
    const m = Math.floor(t / 60), s = Math.floor(t % 60);
    if (m >= 60) { const h = Math.floor(m / 60); return h + ':' + String(m % 60).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }
    return m + ':' + String(s).padStart(2, '0');
  }

  // 直链视频（.mp4 等）的自定义播放器：主题化控件，替代原生 controls。
  // 保留传入的 <video> 元素本身（定点屿论依赖 video.currentTime），只在外层加控件。
  function enhanceFilePlayer(vid) {
    const wrap = document.createElement('div');
    wrap.className = 'py-player';
    vid.parentNode.insertBefore(wrap, vid);
    wrap.appendChild(vid);

    const bar = document.createElement('div');
    bar.className = 'py-controls';
    bar.innerHTML =
      '<button class="py-btn py-play" type="button" aria-label="播放/暂停">▶</button>' +
      '<span class="py-time"><span class="py-cur">0:00</span> / <span class="py-dur">0:00</span></span>' +
      '<div class="py-seek" role="slider" aria-label="进度" tabindex="0"><div class="py-buffered"></div><div class="py-progress"></div></div>' +
      '<button class="py-btn py-mute" type="button" aria-label="静音">🔊</button>' +
      '<input class="py-vol" type="range" min="0" max="100" value="100" aria-label="音量">' +
      '<select class="py-speed" aria-label="倍速"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>' +
      '<button class="py-btn py-fs" type="button" aria-label="全屏">⛶</button>';
    wrap.appendChild(bar);

    const big = document.createElement('button');
    big.className = 'py-bigplay';
    big.type = 'button';
    big.setAttribute('aria-label', '播放');
    big.textContent = '▶';
    wrap.appendChild(big);

    // 长按倍速角标
    const boostBadge = document.createElement('div');
    boostBadge.className = 'py-boost';
    boostBadge.style.display = 'none';
    boostBadge.textContent = '⏩';
    wrap.appendChild(boostBadge);

    const $ = (s) => wrap.querySelector(s);
    const playBtn = $('.py-play'), curEl = $('.py-cur'), durEl = $('.py-dur'),
      seek = $('.py-seek'), buf = $('.py-buffered'), prog = $('.py-progress'),
      muteBtn = $('.py-mute'), vol = $('.py-vol'), speed = $('.py-speed'), fsBtn = $('.py-fs');

    function toggle() { if (vid.paused) vid.play().catch(() => {}); else vid.pause(); }
    function syncIcon() { const p = !vid.paused; playBtn.textContent = p ? '❚❚' : '▶'; big.style.display = p ? 'none' : 'flex'; }
    playBtn.onclick = toggle;
    big.onclick = toggle;
    vid.addEventListener('play', syncIcon);
    vid.addEventListener('pause', syncIcon);

    vid.addEventListener('loadedmetadata', () => { durEl.textContent = fmtTime(vid.duration); });
    vid.addEventListener('timeupdate', () => {
      const d = vid.duration || 0, c = vid.currentTime || 0;
      curEl.textContent = fmtTime(c);
      if (d) prog.style.width = (c / d * 100) + '%';
    });
    vid.addEventListener('progress', () => {
      try {
        if (vid.buffered.length && vid.duration) {
          const end = vid.buffered.end(vid.buffered.length - 1);
          buf.style.width = (end / vid.duration * 100) + '%';
        }
      } catch (e) {}
    });

    function seekTo(clientX) {
      const r = seek.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
      if (vid.duration) vid.currentTime = ratio * vid.duration;
    }
    seek.addEventListener('click', (e) => seekTo(e.clientX));
    seek.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { vid.currentTime = Math.min(vid.duration || 0, vid.currentTime + 10); e.preventDefault(); e.stopPropagation(); }
      else if (e.key === 'ArrowLeft') { vid.currentTime = Math.max(0, vid.currentTime - 10); e.preventDefault(); e.stopPropagation(); }
    });

    // 点击画面 = 播放/暂停
    vid.addEventListener('click', toggle);

    muteBtn.onclick = () => { vid.muted = !vid.muted; muteBtn.textContent = vid.muted ? '🔇' : '🔊'; };
    vol.oninput = () => { vid.volume = vol.value / 100; vid.muted = vid.volume === 0; muteBtn.textContent = vid.muted ? '🔇' : '🔊'; };
    speed.onchange = () => { if (!boosting) vid.playbackRate = parseFloat(speed.value); };
    fsBtn.onclick = () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (wrap.requestFullscreen) wrap.requestFullscreen();
    };
    wrap.addEventListener('dblclick', (e) => { if (e.target !== vol && e.target !== speed) fsBtn.click(); });
    // 长按 →（右方向键）= 3.0× 倍速，松开恢复；短按 = 快进 10 秒
    const BOOST = 3.0;
    let boostTimer = null, boosting = false, boostDown = false;
    wrap.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'k') { toggle(); e.preventDefault(); }
      else if (e.key === 'ArrowRight') {
        e.preventDefault();
        if (!boostDown) {
          boostDown = true;
          boostTimer = setTimeout(() => {
            boosting = true;
            boostBadge.textContent = '⏩ ' + BOOST + '×';
            boostBadge.style.display = 'flex';
            vid.playbackRate = BOOST;
          }, 350);
        }
      }
      else if (e.key === 'ArrowLeft') { vid.currentTime = Math.max(0, vid.currentTime - 10); e.preventDefault(); }
      else if (e.key === 'f') { fsBtn.click(); }
      else if (e.key === 'm') { muteBtn.click(); }
    });
    wrap.addEventListener('keyup', (e) => {
      if (e.key !== 'ArrowRight') return;
      e.preventDefault();
      if (boostTimer) { clearTimeout(boostTimer); boostTimer = null; }
      if (boosting) {
        boosting = false;
        boostBadge.style.display = 'none';
        vid.playbackRate = parseFloat(speed.value) || 1;
      } else {
        vid.currentTime = Math.min(vid.duration || 0, vid.currentTime + 10);
      }
      boostDown = false;
    });
    wrap.tabIndex = 0;
    wrap.focus({ preventScroll: true });
    syncIcon();
  }

  async function load() {
    const { res, data } = await PY.api('/api/videos/' + encodeURIComponent(id));
    if (!res.ok || !data || !data.video) {
      document.querySelector('.player-wrap').style.display = 'none';
      dmBar.style.display = 'none';
      document.getElementById('title').textContent = '视频不存在或已被删除';
      return;
    }
    const v = data.video;
    document.title = v.title + ' · 片屿';

    currentVideo = v;
    currentPr = resolvePlayer(v);
    document.getElementById('playerMode').style.display = '';
    paintModeSeg();
    renderPlayer();

    document.getElementById('title').textContent = v.title;
    const by = v.author ? (v.author.owner ? '站长' : (v.author.name || '岛民')) : '未知';
    const byAv = (v.author && !v.author.owner && v.author.avatar)
      ? `<img class="cm-av" src="${PY.esc(v.author.avatar)}" alt="" style="width:18px;height:18px;border-radius:50%;vertical-align:middle;margin-right:4px" onerror="this.remove()">`
      : '';
    const WT = { original: '原创', derivative: '二创', remix: '三创及以上', repost: '搬运' };
    document.getElementById('meta').innerHTML =
      `<span>${PY.fmtViews(v.views)} 位岛民看过</span><span>${PY.fmtDate(v.createdAt)}</span>` +
      `<span>由 ${byAv}${PY.esc(by)} 发布</span>` +
      (pr.mode === 'file' ? '<span>外链直链</span>' : (pr.blockedCN ? '<span class="wt-badge" style="background:#7a3b3b;color:#ffd9d9;border-color:#7a3b3b">境外·可能受限</span>' : '<span>外链嵌入</span>')) +
      (v.workType ? `<span class="wt-badge wt-${v.workType}">${WT[v.workType] || '原创'}</span>` : '');
    document.getElementById('tags').innerHTML = (v.tags || [])
      .map((t) => `<a class="tag" href="index.html?tag=${encodeURIComponent(t)}">${PY.esc(t)}</a>`)
      .join(' ');
    document.getElementById('desc').textContent = v.desc || '';
    // 引用外站时，在播放器下方显示原网站地址，便于查看 / 复制
    const srcEl = document.getElementById('srcLine');
    if (pr.mode === 'embed' && !pr.blockedCN) {
      srcEl.style.display = '';
      srcEl.innerHTML = '原网站地址：<a href="' + PY.esc(pr.raw) + '" target="_blank" rel="noopener noreferrer">' + PY.esc(pr.raw) + '</a>';
    } else {
      srcEl.style.display = 'none';
    }

    loadDanmaku();
    loadComments();
    loadLikes();
  }

  async function loadDanmaku() {
    const { data } = await PY.api('/api/danmaku?videoId=' + encodeURIComponent(id));
    danmaku = (data && data.danmaku) || [];
  }

  function startDmLoop() {
    if (dmLoopRunning) return;
    dmLoopRunning = true;
    let last = -1;
    function tick() {
      requestAnimationFrame(tick);
      if (!video) return;
      const t = video.currentTime;
      if (t < last - 1) dmShown = Object.create(null); // seeked backwards -> replay
      last = t;
      danmaku.forEach((d) => {
        if (!dmShown[d.id] && t >= d.time && t - d.time < 0.6) {
          dmShown[d.id] = 1;
          spawnDm(d);
        }
      });
    }
    requestAnimationFrame(tick);
  }

  // 按当前播放方式（片屿播放器 / 网页直连）渲染播放器
  function renderPlayer() {
    host.innerHTML = '';
    video = null;
    const v = currentVideo, pr = currentPr;
    if (!v || !pr) return;
    if (pr.mode === 'embed') {
      mountEmbed(pr, host);
      dmBar.innerHTML = playerMode === 'direct'
        ? '<span class="dm-hint">网页直连模式：由 ' + PY.esc(pr.host) + ' 原站播放器托管，片屿控件（倍速 / 长按）不生效。</span>'
        : (pr.blockedCN
            ? '<span class="dm-hint">此视频来自境外平台，境内网络可能受限，已提供「在新标签打开」入口。</span>'
            : '<span class="dm-hint">此视频为「嵌入页」模式，播放器由外部站点托管，无法读取播放时间，定点屿论不可用（直链视频支持）。</span>');
    } else {
      video = document.createElement('video');
      video.src = pr.url;
      video.playsInline = true;
      video.preload = 'metadata';
      if (v.cover) video.poster = v.cover;
      host.appendChild(video);
      if (playerMode === 'direct') {
        video.controls = true; // 网页直连：浏览器原生播放器
      } else {
        enhanceFilePlayer(video);
      }
      startDmLoop();
    }
  }

  function paintModeSeg() {
    document.querySelectorAll('#modeSeg button').forEach((b) => b.classList.toggle('on', b.dataset.mode === playerMode));
  }
  const modeSeg = document.getElementById('modeSeg');
  if (modeSeg) {
    modeSeg.querySelectorAll('button').forEach((b) => {
      b.onclick = () => {
        playerMode = b.dataset.mode;
        try { localStorage.setItem('pianyu-playmode', playerMode); } catch (e) {}
        paintModeSeg();
        renderPlayer();
      };
    });
  }

  document.getElementById('dmSend').onclick = async () => {
    const text = document.getElementById('dmText').value.trim();
    if (!text) return;
    if (!video) { alert('此模式不支持定点屿论'); return; }
    const time = video.currentTime;
    const { res, data } = await PY.api('/api/danmaku', { method: 'POST', body: JSON.stringify({ videoId: id, text, time }) });
    if (res.ok) {
      document.getElementById('dmText').value = '';
      danmaku.push(data.danmaku);
      spawnDm(data.danmaku);
    } else {
      alert('发送失败：' + ((data && data.error) || res.status));
    }
  };
  document.getElementById('dmText').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('dmSend').click();
  });
  document.getElementById('dmToggle').onchange = (e) => {
    dmEnabled = e.target.checked;
    dmLayer.style.display = dmEnabled ? 'block' : 'none';
  };

  /* ---------------- 屿论 (comments) ---------------- */
  async function loadComments() {
    const { data } = await PY.api('/api/comments?videoId=' + encodeURIComponent(id));
    const list = (data && data.comments) || [];
    document.getElementById('cmCount').textContent = list.length ? '(' + list.length + ')' : '';
    const box = document.getElementById('cmList');
    box.innerHTML = '';
    if (!list.length) { box.innerHTML = '<p class="dm-hint">还没有屿论，来占个座吧。</p>'; return; }
    list.slice().reverse().forEach((c) => {
      const el = document.createElement('div');
      el.className = 'cm-item';
      el.id = 'cm-' + c.id;
      const av = c.avatar
        ? `<img class="cm-av" src="${PY.esc(c.avatar)}" alt="" loading="lazy" onerror="this.remove()">`
        : '';
      const badge = c.isAdmin ? '<span class="badge">站长</span>' : '';
      el.innerHTML =
        `<div class="cm-head">${av}<span class="who">${PY.esc(c.name)}</span>${badge}<span class="when">${PY.fmtDate(c.createdAt)}</span></div>` +
        `<div class="cm-text">${PY.esc(c.text)}</div>` +
        `<a class="cm-report" data-id="${PY.esc(c.id)}">举报</a>`;
      box.appendChild(el);
    });
  }

  document.getElementById('cmSend').onclick = async () => {
    const text = document.getElementById('cmText').value.trim();
    const nameEl = document.getElementById('cmName');
    // 已登录时服务端以会话身份为准；未登录则用输入框里的岛民名
    const name = nameEl ? nameEl.value.trim() : '';
    if (!text) { document.getElementById('cmMsg').textContent = '内容不能为空'; return; }
    const { res, data } = await PY.api('/api/comments', { method: 'POST', body: JSON.stringify({ videoId: id, name, text }) });
    if (res.ok) {
      document.getElementById('cmText').value = '';
      document.getElementById('cmMsg').textContent = '';
      loadComments();
    } else {
      document.getElementById('cmMsg').textContent = '发送失败：' + ((data && data.error) || res.status);
    }
  };

  /* ---------------- 点赞 (likes) ---------------- */
  async function loadLikes() {
    const { data } = await PY.api('/api/likes?videoId=' + encodeURIComponent(id));
    if (data && data.ok) {
      document.getElementById('likeCount').textContent = data.count;
      const btn = document.getElementById('likeBtn');
      if (data.liked) btn.classList.add('on');
      else btn.classList.remove('on');
    }
  }
  document.getElementById('likeBtn').onclick = async () => {
    if (!me) { location.href = '/api/sso/start?next=' + encodeURIComponent(location.pathname + location.search); return; }
    const { res, data } = await PY.api('/api/likes', { method: 'POST', body: JSON.stringify({ videoId: id }) });
    if (res.ok && data.ok) {
      document.getElementById('likeCount').textContent = data.count;
      document.getElementById('likeBtn').classList.toggle('on', data.liked);
    } else {
      alert('操作失败：' + ((data && data.error) || res.status));
    }
  };

  /* ---------------- 举报 (report) ---------------- */
  let reportState = { kind: 'video', targetId: '' };
  function openReport(kind, targetId) {
    if (!me) { location.href = '/api/sso/start?next=' + encodeURIComponent(location.pathname + location.search); return; }
    reportState = { kind, targetId };
    document.getElementById('reportTitle').textContent =
      kind === 'video' ? '举报这部片子' : (kind === 'comment' ? '举报这条屿论' : '举报这条定点屿论');
    document.getElementById('reportText').value = '';
    document.getElementById('reportModal').style.display = 'flex';
  }
  function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }
  document.getElementById('reportBtn').onclick = () => openReport('video', '');
  document.getElementById('reportCancel').onclick = closeReportModal;
  document.getElementById('reportModal').addEventListener('click', (e) => {
    if (e.target.id === 'reportModal') closeReportModal();
  });
  document.getElementById('cmList').addEventListener('click', (e) => {
    const t = e.target.closest('.cm-report');
    if (t) openReport('comment', t.dataset.id);
  });
  document.getElementById('reportSubmit').onclick = async () => {
    const reason = (document.querySelector('input[name="rr"]:checked') || {}).value || 'other';
    const text = document.getElementById('reportText').value.trim();
    const { res, data } = await PY.api('/api/report', {
      method: 'POST',
      body: JSON.stringify({ videoId: id, kind: reportState.kind, targetId: reportState.targetId, reason, text }),
    });
    if (res.ok && data.ok) {
      closeReportModal();
      alert('举报已提交，感谢你的反馈。');
    } else {
      alert('提交失败：' + ((data && data.error) || res.status));
    }
  };

  /* ---------------- 管理员举报审核（来自 ?report=<id>） ---------------- */
  function backToPanel() {
    let url = 'manage.html';
    try {
      const ret = sessionStorage.getItem('pianyu_report_return');
      if (ret) url = ret;
    } catch (e) {}
    try { sessionStorage.removeItem('pianyu_report_return'); } catch (e) {}
    location.href = url;
  }

  async function initReportReview() {
    const rid = PY.qs('report');
    if (!rid) return;
    const review = document.getElementById('reportReview');
    const body = document.getElementById('rrBody');
    if (!review || !body) return;

    const isAdm = await PY.isAdmin();
    if (!isAdm) {
      review.style.display = 'block';
      body.innerHTML = '<p class="hint">只有管理员 / 站长才能审核举报。请先以管理员身份登录，或返回面板。</p>';
      return;
    }
    const { res, data } = await PY.api('/api/admin/reports');
    if (!res.ok || !data || !data.ok) {
      review.style.display = 'block';
      body.innerHTML = '<p class="hint">读取举报失败。</p>';
      return;
    }
    const r = (data.reports || []).find((x) => x.id === rid);
    if (!r) {
      review.style.display = 'block';
      body.innerHTML = '<p class="hint">该举报已处理或不存在。</p>';
      return;
    }
    const RT = { spam: '垃圾广告/刷屏', abuse: '不当或有害内容', copyright: '侵权/未授权', other: '其他' };
    const KT = { video: '视频', comment: '屿论', danmaku: '定点屿论' };
    const reason = RT[r.reason] || '其他';
    const kind = KT[r.kind] || r.kind;
    body.innerHTML =
      '<div class="rr-line"><b>类型：</b>' + PY.esc(kind) + '　<b>理由：</b>' + PY.esc(reason) + '</div>' +
      '<div class="rr-line"><b>被举报：</b>' + PY.esc(r.videoTitle || r.videoId) +
        (r.kind !== 'video' ? '（目标 ' + PY.esc(r.targetId) + '）' : '') + '</div>' +
      '<div class="rr-line"><b>举报人：</b>' + PY.esc(r.name) + (r.login ? ' @' + PY.esc(r.login) : '') + '</div>' +
      (r.text ? '<div class="rr-line rr-text">补充说明：' + PY.esc(r.text) + '</div>' : '');

    review.style.display = 'block';

    const tid = PY.qs('tid');
    if (tid) {
      const el = document.getElementById('cm-' + tid);
      if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('cm-flagged'); }
    } else {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    let busy = false;
    async function decide(action) {
      if (busy) return; busy = true;
      if (action === 'delete' && !confirm('举报通过＝删除被举报的内容（视频整体删除 / 屿论·定点屿论仅删该条），确定？')) { busy = false; return; }
      const { res: r2, data: d2 } = await PY.api('/api/admin/reports', { method: 'POST', body: JSON.stringify({ id: rid, action }) });
      busy = false;
      if (r2.ok) backToPanel();
      else alert('操作失败：' + ((d2 && d2.error) || r2.status));
    }
    document.getElementById('rrPass').onclick = () => decide('delete');
    document.getElementById('rrReject').onclick = () => decide('resolve');
    document.getElementById('rrBack').onclick = backToPanel;
    document.getElementById('rrClose').onclick = backToPanel;
  }

  load();
})();
</script>
