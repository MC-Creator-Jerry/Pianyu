<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>观看 · 片屿</title>
<script>try{var p=localStorage.getItem('pianyu-theme')||'auto';var t=(p==='light'||p==='dark')?p:((window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
<link rel="icon" href="assets/favicon.svg?v=6" type="image/svg+xml">
<link rel="stylesheet" href="assets/pianyu.css?v=20260928">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img class="logo" src="assets/favicon.svg?v=6" alt="片屿">
      片屿<span class="sub">PIANYU</span>
    </a>
    <div class="spacer"></div>
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="map.html">岛图</a>
      <a href="admin.html">上新</a>
      <a href="creator.html">创作岛</a>
    </nav>
    <div class="hdr-right" id="hdrRight"></div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="player-wrap">
    <div id="videoHost"></div>
    <div id="dmLayer" class="dm-layer"></div>
  </div>

  <div class="dm-bar" id="dmBar">
    <input id="dmText" class="input" type="text" maxlength="60" placeholder="发一条定点屿论（会钉在当前时间点）…">
    <button id="dmSend" class="btn primary sm">定点发送</button>
    <label class="dm-hint"><input type="checkbox" id="dmToggle" checked> 显示定点屿论</label>
  </div>

  <h1 id="title" class="watch-title"></h1>
  <div id="meta" class="watch-meta"></div>
  <div id="tags" class="tags"></div>
    <div id="desc" class="watch-desc"></div>

    <div class="watch-actions" id="watchActions">
      <button id="likeBtn" class="act-btn" type="button"><span class="ic">👍</span> <span id="likeCount">0</span></button>
      <button id="reportBtn" class="act-btn ghost" type="button">🚩 举报</button>
    </div>

  <section class="yulun">
    <h2>屿论 <span class="count" id="cmCount"></span></h2>
    <div class="cm-form">
      <div class="row" id="cmNameRow">
        <input id="cmName" class="input" type="text" maxlength="24" placeholder="岛民名（可留空，默认匿名岛民）">
      </div>
      <div class="row" id="cmWhoRow" style="display:none">
        <span class="dm-hint">以 <b id="cmWho"></b> 的身份发表屿论</span>
      </div>
      <textarea id="cmText" class="textarea" maxlength="500" placeholder="说点什么…"></textarea>
      <div><button id="cmSend" class="btn primary">发表屿论</button> <span id="cmMsg" class="dm-hint"></span></div>
    </div>
    <div id="cmList" class="cm-list"></div>
  </section>
</main>

<div class="modal" id="reportModal" style="display:none">
  <div class="modal-card">
    <h3 id="reportTitle">举报内容</h3>
    <p class="hint" id="reportHint">我们会尽快核实处理。举报需登录，匿名无法提交。</p>
    <div class="report-reasons">
      <label><input type="radio" name="rr" value="spam" checked> 垃圾广告 / 刷屏</label>
      <label><input type="radio" name="rr" value="abuse"> 不当或有害内容</label>
      <label><input type="radio" name="rr" value="copyright"> 侵权 / 未授权</label>
      <label><input type="radio" name="rr" value="other"> 其他</label>
    </div>
    <textarea id="reportText" class="textarea" maxlength="300" placeholder="补充说明（可选，最多 300 字）"></textarea>
    <div class="modal-actions">
      <button id="reportCancel" class="btn" type="button">取消</button>
      <button id="reportSubmit" class="btn primary" type="button">提交举报</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap"><span>© 片屿 · PIANYU</span></div>
</footer>

<script src="assets/pianyu.js?v=20260930"></script>
<script>
(function () {
  const id = PY.qs('id');
  const host = document.getElementById('videoHost');
  const dmLayer = document.getElementById('dmLayer');
  const dmBar = document.getElementById('dmBar');

  PY.showSsoNotice();
  const hdrReady = PY.mountHeader();

  if (!id) {
    document.querySelector('.player-wrap').style.display = 'none';
    dmBar.style.display = 'none';
    document.getElementById('title').textContent = '缺少视频 ID';
    return;
  }

  /* ---------------- 登录身份 ---------------- */
  let me = null;
  hdrReady.then(async () => {
    me = await PY.user.load();
    if (me) {
      document.getElementById('cmNameRow').style.display = 'none';
      document.getElementById('cmWhoRow').style.display = 'flex';
      document.getElementById('cmWho').textContent = me.name || me.login || '岛民';
    }
  });

  /* ---------------- 定点屿论 (danmaku) ---------------- */
  const DM_LANES = 5, DM_LANE_H = 28, DM_TOP = 8;
  let danmaku = [], dmShown = Object.create(null), dmEnabled = true, dmIndex = 0;

  function spawnDm(d) {
    if (!dmEnabled) return;
    const el = document.createElement('div');
    el.className = 'dm-item';
    el.textContent = d.text;
    if (d.color) el.style.color = d.color;
    el.style.top = (DM_TOP + (dmIndex % DM_LANES) * DM_LANE_H) + 'px';
    dmIndex++;
    const dur = Math.min(16, 7 + d.text.length * 0.12);
    el.style.animationDuration = dur + 's';
    el.addEventListener('animationend', () => el.remove());
    dmLayer.appendChild(el);
  }

  /* ---------------- load ---------------- */
  let video = null;

  async function load() {
    const { res, data } = await PY.api('/api/videos/' + encodeURIComponent(id));
    if (!res.ok || !data || !data.video) {
      document.querySelector('.player-wrap').style.display = 'none';
      dmBar.style.display = 'none';
      document.getElementById('title').textContent = '视频不存在或已被删除';
      return;
    }
    const v = data.video;
    document.title = v.title + ' · 片屿';

    if (v.source === 'embed') {
      const f = document.createElement('iframe');
      f.src = v.url;
      f.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
      f.setAttribute('allowfullscreen', '');
      f.setAttribute('referrerpolicy', 'no-referrer');
      host.appendChild(f);
      // embed mode cannot track time -> 定点屿论 unavailable
      dmBar.innerHTML = '<span class="dm-hint">此视频为「嵌入页」模式，播放器由外部站点托管，无法读取播放时间，定点屿论不可用（直链视频支持）。</span>';
    } else {
      video = document.createElement('video');
      video.src = v.url;
      video.controls = true;
      video.playsInline = true;
      video.preload = 'metadata';
      if (v.cover) video.poster = v.cover;
      host.appendChild(video);
      startDmLoop();
    }

    document.getElementById('title').textContent = v.title;
    const by = v.author ? (v.author.owner ? '站长' : (v.author.name || '岛民')) : '未知';
    const byAv = (v.author && !v.author.owner && v.author.avatar)
      ? `<img class="cm-av" src="${PY.esc(v.author.avatar)}" alt="" style="width:18px;height:18px;border-radius:50%;vertical-align:middle;margin-right:4px" onerror="this.remove()">`
      : '';
    document.getElementById('meta').innerHTML =
      `<span>${PY.fmtViews(v.views)} 位岛民看过</span><span>${PY.fmtDate(v.createdAt)}</span>` +
      `<span>由 ${byAv}${PY.esc(by)} 发布</span>` +
      (v.source === 'embed' ? '<span>外链嵌入</span>' : '<span>外链直链</span>');
    document.getElementById('tags').innerHTML = (v.tags || [])
      .map((t) => `<a class="tag" href="index.html?tag=${encodeURIComponent(t)}">${PY.esc(t)}</a>`)
      .join(' ');
    document.getElementById('desc').textContent = v.desc || '';

    loadDanmaku();
    loadComments();
    loadLikes();
  }

  async function loadDanmaku() {
    const { data } = await PY.api('/api/danmaku?videoId=' + encodeURIComponent(id));
    danmaku = (data && data.danmaku) || [];
  }

  function startDmLoop() {
    let last = -1;
    function tick() {
      requestAnimationFrame(tick);
      if (!video) return;
      const t = video.currentTime;
      if (t < last - 1) dmShown = Object.create(null); // seeked backwards -> replay
      last = t;
      danmaku.forEach((d) => {
        if (!dmShown[d.id] && t >= d.time && t - d.time < 0.6) {
          dmShown[d.id] = 1;
          spawnDm(d);
        }
      });
    }
    requestAnimationFrame(tick);
  }

  document.getElementById('dmSend').onclick = async () => {
    const text = document.getElementById('dmText').value.trim();
    if (!text) return;
    if (!video) { alert('此模式不支持定点屿论'); return; }
    const time = video.currentTime;
    const { res, data } = await PY.api('/api/danmaku', { method: 'POST', body: JSON.stringify({ videoId: id, text, time }) });
    if (res.ok) {
      document.getElementById('dmText').value = '';
      danmaku.push(data.danmaku);
      spawnDm(data.danmaku);
    } else {
      alert('发送失败：' + ((data && data.error) || res.status));
    }
  };
  document.getElementById('dmText').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('dmSend').click();
  });
  document.getElementById('dmToggle').onchange = (e) => {
    dmEnabled = e.target.checked;
    dmLayer.style.display = dmEnabled ? 'block' : 'none';
  };

  /* ---------------- 屿论 (comments) ---------------- */
  async function loadComments() {
    const { data } = await PY.api('/api/comments?videoId=' + encodeURIComponent(id));
    const list = (data && data.comments) || [];
    document.getElementById('cmCount').textContent = list.length ? '(' + list.length + ')' : '';
    const box = document.getElementById('cmList');
    box.innerHTML = '';
    if (!list.length) { box.innerHTML = '<p class="dm-hint">还没有屿论，来占个座吧。</p>'; return; }
    list.slice().reverse().forEach((c) => {
      const el = document.createElement('div');
      el.className = 'cm-item';
      const av = c.avatar
        ? `<img class="cm-av" src="${PY.esc(c.avatar)}" alt="" loading="lazy" onerror="this.remove()">`
        : '';
      const badge = c.isAdmin ? '<span class="badge">站长</span>' : '';
      el.innerHTML =
        `<div class="cm-head">${av}<span class="who">${PY.esc(c.name)}</span>${badge}<span class="when">${PY.fmtDate(c.createdAt)}</span></div>` +
        `<div class="cm-text">${PY.esc(c.text)}</div>` +
        `<a class="cm-report" data-id="${PY.esc(c.id)}">举报</a>`;
      box.appendChild(el);
    });
  }

  document.getElementById('cmSend').onclick = async () => {
    const text = document.getElementById('cmText').value.trim();
    const nameEl = document.getElementById('cmName');
    // 已登录时服务端以会话身份为准；未登录则用输入框里的岛民名
    const name = nameEl ? nameEl.value.trim() : '';
    if (!text) { document.getElementById('cmMsg').textContent = '内容不能为空'; return; }
    const { res, data } = await PY.api('/api/comments', { method: 'POST', body: JSON.stringify({ videoId: id, name, text }) });
    if (res.ok) {
      document.getElementById('cmText').value = '';
      document.getElementById('cmMsg').textContent = '';
      loadComments();
    } else {
      document.getElementById('cmMsg').textContent = '发送失败：' + ((data && data.error) || res.status);
    }
  };

  /* ---------------- 点赞 (likes) ---------------- */
  async function loadLikes() {
    const { data } = await PY.api('/api/likes?videoId=' + encodeURIComponent(id));
    if (data && data.ok) {
      document.getElementById('likeCount').textContent = data.count;
      const btn = document.getElementById('likeBtn');
      if (data.liked) btn.classList.add('on');
      else btn.classList.remove('on');
    }
  }
  document.getElementById('likeBtn').onclick = async () => {
    if (!me) { location.href = '/api/sso/start?next=' + encodeURIComponent(location.pathname + location.search); return; }
    const { res, data } = await PY.api('/api/likes', { method: 'POST', body: JSON.stringify({ videoId: id }) });
    if (res.ok && data.ok) {
      document.getElementById('likeCount').textContent = data.count;
      document.getElementById('likeBtn').classList.toggle('on', data.liked);
    } else {
      alert('操作失败：' + ((data && data.error) || res.status));
    }
  };

  /* ---------------- 举报 (report) ---------------- */
  let reportState = { kind: 'video', targetId: '' };
  function openReport(kind, targetId) {
    if (!me) { location.href = '/api/sso/start?next=' + encodeURIComponent(location.pathname + location.search); return; }
    reportState = { kind, targetId };
    document.getElementById('reportTitle').textContent =
      kind === 'video' ? '举报这部片子' : (kind === 'comment' ? '举报这条屿论' : '举报这条定点屿论');
    document.getElementById('reportText').value = '';
    document.getElementById('reportModal').style.display = 'flex';
  }
  function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }
  document.getElementById('reportBtn').onclick = () => openReport('video', '');
  document.getElementById('reportCancel').onclick = closeReportModal;
  document.getElementById('reportModal').addEventListener('click', (e) => {
    if (e.target.id === 'reportModal') closeReportModal();
  });
  document.getElementById('cmList').addEventListener('click', (e) => {
    const t = e.target.closest('.cm-report');
    if (t) openReport('comment', t.dataset.id);
  });
  document.getElementById('reportSubmit').onclick = async () => {
    const reason = (document.querySelector('input[name="rr"]:checked') || {}).value || 'other';
    const text = document.getElementById('reportText').value.trim();
    const { res, data } = await PY.api('/api/report', {
      method: 'POST',
      body: JSON.stringify({ videoId: id, kind: reportState.kind, targetId: reportState.targetId, reason, text }),
    });
    if (res.ok && data.ok) {
      closeReportModal();
      alert('举报已提交，感谢你的反馈。');
    } else {
      alert('提交失败：' + ((data && data.error) || res.status));
    }
  };

  load();
})();
</script>
  <script src="/assets/scroll-keys.js?v=20260926" defer></script>
</body>
</html>
