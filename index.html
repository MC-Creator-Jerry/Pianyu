<body>

<main class="wrap">
  <div class="toolbar">
    <input id="q" class="input search" type="search" placeholder="搜索标题 / 简介 / 标签…" autocomplete="off">
    <div class="seg" id="sortSeg" role="group" aria-label="排序方式">
      <button data-s="time" class="on">最新</button>
      <button data-s="views">流量</button>
    </div>
    <button id="btnClear" class="btn">清空</button>
  </div>
  <div id="chips" class="chips"></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">这里还是一片空岛 —— 去 <a href="admin.html">上新</a> 放上第一个视频吧。</div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>© <span id="yr"></span> 片屿 · PIANYU</span>
    <span class="spacer"></span>
    <span>独立站点 · 独立后端（Cloudflare Pages + Functions）</span>
  </div>
</footer>

<script src="assets/pianyu.js?v=20260937"></script>
<script>
(function () {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const chips = document.getElementById('chips');
  const qInput = document.getElementById('q');
  document.getElementById('yr').textContent = new Date().getFullYear();

  let state = { q: '', tag: '', sort: (function () { try { return localStorage.getItem('pianyu-sort') || 'time'; } catch (e) { return 'time'; } })() };
  let debounce = null;

  async function load() {
    const params = new URLSearchParams();
    if (state.q) params.set('q', state.q);
    if (state.tag) params.set('tag', state.tag);
    if (state.sort) params.set('sort', state.sort);
    const { data } = await PY.api('/api/videos?' + params.toString());
    const videos = (data && data.videos) || [];
    const tags = (data && data.tags) || [];

    // chips
    chips.innerHTML = '';
    if (tags.length) {
      const all = document.createElement('button');
      all.className = 'chip' + (state.tag ? '' : ' on');
      all.textContent = '全部';
      all.onclick = () => { state.tag = ''; load(); };
      chips.appendChild(all);
      tags.forEach((t) => {
        const c = document.createElement('button');
        c.className = 'chip' + (state.tag === t ? ' on' : '');
        c.textContent = t;
        c.onclick = () => { state.tag = state.tag === t ? '' : t; load(); };
        chips.appendChild(c);
      });
    }

    grid.innerHTML = '';
    videos.forEach((v) => grid.appendChild(PY.card(v)));
    empty.style.display = videos.length ? 'none' : 'block';
  }

  qInput.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { state.q = qInput.value.trim(); load(); }, 220);
  });
  document.getElementById('btnClear').onclick = () => {
    qInput.value = ''; state.q = ''; state.tag = ''; load();
  };

  /* ---------- 排序方式（最新 / 流量）---------- */
  const sortSeg = document.getElementById('sortSeg');
  function paintSort() {
    sortSeg.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.s === state.sort));
  }
  sortSeg.querySelectorAll('button').forEach((b) => {
    b.onclick = () => {
      state.sort = b.dataset.s;
      try { localStorage.setItem('pianyu-sort', state.sort); } catch (e) {}
      paintSort();
      load();
    };
  });
  paintSort();

  const u = new URLSearchParams(location.search);
  state.q = u.get('q') || '';
  state.tag = u.get('tag') || '';
  qInput.value = state.q;
  load();

  PY.showSsoNotice();
  PY.mountHeader();
})();
</script>
