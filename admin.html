<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上新 · 片屿</title>
<script>try{var p=localStorage.getItem('pianyu-theme')||'auto';var t=(p==='light'||p==='dark')?p:((window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/pianyu.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img class="logo" src="assets/favicon.svg" alt="片屿">
      片屿<span class="sub">PIANYU</span>
    </a>
    <div class="spacer"></div>
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="map.html">岛图</a>
      <a href="admin.html" class="on">上新</a>
    </nav>
    <div class="hdr-right" id="hdrRight"></div>
  </div>
</header>

<main class="wrap">
  <!-- 未登录 -->
  <section id="gate" class="gate" style="display:none">
    <div class="ic">🏝️</div>
    <h2>登岛后才能上新</h2>
    <p>用小蓝页账户登录后，就能在这座岛上发布你的视频，并管理你自己发的片子。</p>
    <a class="btn primary" id="gateLogin" href="/api/sso/start?next=%2Fadmin.html">用小蓝页登录</a>
  </section>

  <!-- 已登录：上新 -->
  <section id="adminPanel" style="display:none">
    <div class="panel">
      <h2 id="formTitle">上新</h2>
      <input type="hidden" id="editId" value="">
      <div class="field"><label>标题 *</label><input id="fTitle" class="input" placeholder="视频标题"></div>
      <div class="field"><label>视频地址 *（外链）</label><input id="fUrl" class="input" placeholder="https://... 直链 mp4 或 嵌入页地址"></div>
      <div class="row2">
        <div class="field">
          <label>来源类型</label>
          <select id="fSource" class="select">
            <option value="file">直链视频（mp4/webm…，用 &lt;video&gt; 播放）</option>
            <option value="embed">嵌入页（B站/YouTube 等，用 &lt;iframe&gt; 播放）</option>
          </select>
        </div>
        <div class="field"><label>时长（可选，如 03:24）</label><input id="fDuration" class="input" placeholder="03:24"></div>
      </div>
      <div class="field"><label>封面图地址（可选）</label><input id="fCover" class="input" placeholder="https://.../cover.jpg"></div>
      <div class="field"><label>标签（逗号或空格分隔，可选）</label><input id="fTags" class="input" placeholder="电影, 旅行, 音乐"></div>
      <div class="field"><label>简介（可选）</label><textarea id="fDesc" class="textarea"></textarea></div>
      <button id="btnSave" class="btn primary">保存</button>
      <button id="btnCancel" class="btn" style="display:none">取消编辑</button>
      <div id="formMsg"></div>
    </div>

    <div class="panel" id="upPanel">
      <h2>发布功能升级</h2>
      <p class="hint">想让每天能多发一些？开通下面的计划，片屿每日发布上限 +10，并解锁高级版功能。</p>
      <div class="plan-card">
        <div class="plan-main">
          <div class="plan-name">片屿 · 发布功能升级</div>
          <div class="plan-price">¥13.25<span>/月</span></div>
          <ul class="plan-benefits">
            <li>开通后片屿每日发布帖子上限 +10</li>
            <li>解锁高级版功能</li>
          </ul>
        </div>
        <div class="plan-cta">
          <a class="btn primary" id="btnAfdian" href="https://ifdian.net/order/create?plan_id=8ffb1aa0b87711f1b03952540025c377&amp;product_type=0" target="_blank" rel="noopener">发电 ¥13.25 /月</a>
        </div>
      </div>
      <p class="hint" style="margin-top:12px">发电入口由爱发电提供；完成发电后，站长会为你开通升级权益。</p>
    </div>

    <div class="panel">
      <h2>我的投稿（<span id="myCnt">0</span>）</h2>
      <p class="hint">这里只列你用自己的小蓝页账户投过的视频，可随时编辑或删除。</p>
      <div id="myList" class="admin-list"></div>
    </div>

    <div class="panel">
      <h2>岛上视频（<span id="cnt">0</span>）</h2>
      <div id="list" class="admin-list"></div>
    </div>
  </section>
</main>

<footer class="site-footer"><div class="wrap"><span>© 片屿 · PIANYU</span></div></footer>

<script src="assets/pianyu.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const adminPanel = $('adminPanel');

  function msg(el, text, type) {
    el.innerHTML = text ? `<div class="notice ${type || 'ok'}">${PY.esc(text)}</div>` : '';
  }

  // 与 msg 相同，但不转义（用于内嵌链接）
  function msgHtml(el, html, type) {
    el.innerHTML = html ? `<div class="notice ${type || 'ok'}">${html}</div>` : '';
  }

  function isMod(v, me) {
    const isOwner = !!(me && me.isAdmin);
    const mySub = me && me.sub;
    return isOwner || (v.author && v.author.sub && mySub && String(v.author.sub) === String(mySub));
  }

  function rowHtml(v, me) {
    const canMod = isMod(v, me);
    const by = v.author ? (v.author.owner ? '站长' : PY.esc(v.author.name || '岛民')) : '未知';
    return `<div class="t">` +
        `<div class="n">${PY.esc(v.title)}</div>` +
        `<div class="u">${PY.esc(v.source)} · ${PY.esc(v.url)} · 由 ${by} 发布</div>` +
      `</div>` +
      `<a class="btn sm" href="watch.html?id=${encodeURIComponent(v.id)}" target="_blank">看</a>` +
      (canMod ? `<button class="btn sm" data-edit="${v.id}">编辑</button>` : '') +
      (canMod ? `<button class="btn sm danger" data-del="${v.id}">删除</button>` : '');
  }

  function renderList(el, videos, me) {
    el.innerHTML = '';
    if (!videos.length) { el.innerHTML = '<p class="hint">这里还没有视频。</p>'; return; }
    videos.forEach((v) => {
      const row = document.createElement('div');
      row.className = 'admin-item';
      row.innerHTML = rowHtml(v, me);
      el.appendChild(row);
    });
    el.querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => startEdit(b.dataset.edit, videos));
    el.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => del(b.dataset.del, videos, me));
  }

  async function refresh(me) {
    const { data } = await PY.api('/api/videos');
    const videos = (data && data.videos) || [];
    const isOwner = !!(me && me.isAdmin);
    const mySub = me && me.sub;
    const mine = videos.filter((v) =>
      isOwner ? (v.author && v.author.owner) : (v.author && v.author.sub && mySub && String(v.author.sub) === String(mySub))
    );
    $('cnt').textContent = videos.length;
    $('myCnt').textContent = mine.length;
    renderList($('list'), videos, me);
    renderList($('myList'), mine, me);
  }

  function resetForm() {
    $('editId').value = '';
    $('fTitle').value = ''; $('fUrl').value = ''; $('fSource').value = 'file';
    $('fDuration').value = ''; $('fCover').value = ''; $('fTags').value = ''; $('fDesc').value = '';
    $('formTitle').textContent = '上新';
    $('btnCancel').style.display = 'none';
    msg($('formMsg'), '');
  }

  function startEdit(id, videos) {
    const v = videos.find((x) => x.id === id);
    if (!v) return;
    $('editId').value = v.id;
    $('fTitle').value = v.title || '';
    $('fUrl').value = v.url || '';
    $('fSource').value = v.source || 'file';
    $('fDuration').value = v.duration || '';
    $('fCover').value = v.cover || '';
    $('fTags').value = (v.tags || []).join(', ');
    $('fDesc').value = v.desc || '';
    $('formTitle').textContent = '改一下这条';
    $('btnCancel').style.display = 'inline-block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function del(id, videos, me) {
    const v = videos.find((x) => x.id === id);
    if (!confirm('确定删除「' + (v ? v.title : id) + '」？此操作不可撤销。')) return;
    const { res, data } = await PY.api('/api/videos/' + encodeURIComponent(id), { method: 'DELETE' });
    if (res.ok) refresh(me);
    else alert('删除失败：' + ((data && data.error) || res.status));
  }

  async function save() {
    const id = $('editId').value;
    const payload = {
      title: $('fTitle').value.trim(),
      url: $('fUrl').value.trim(),
      source: $('fSource').value,
      duration: $('fDuration').value.trim(),
      cover: $('fCover').value.trim(),
      tags: $('fTags').value,
      desc: $('fDesc').value.trim(),
    };
    if (!payload.title || !payload.url) { msg($('formMsg'), '标题和视频地址必填', 'err'); return; }
    const path = id ? '/api/videos/' + encodeURIComponent(id) : '/api/videos';
    const method = id ? 'PATCH' : 'POST';
    const { res, data } = await PY.api(path, { method, body: JSON.stringify(payload) });
    if (res.ok) {
      msg($('formMsg'), id ? '已更新' : '已添加', 'ok');
      resetForm();
      const me = await PY.user.load(true);
      refresh(me);
    } else if (data && data.error === 'daily_limit') {
      msgHtml(
        $('formMsg'),
        '保存失败：' + PY.esc(data.message || '今天的上新已达上限') +
          '　<a href="' + PY.AFDIAN_URL + '" target="_blank" rel="noopener">发电升级，每天 +10 →</a>',
        'err'
      );
    } else {
      const m = (data && (data.message || data.error)) || ('HTTP ' + res.status);
      msg($('formMsg'), '保存失败：' + m, 'err');
    }
  }

  function showAdmin(me) {
    adminPanel.style.display = 'block';
    document.getElementById('gate').style.display = 'none';
    // 站长不受每日上限约束，升级入口对站长隐藏
    const up = $('upPanel');
    if (up) up.style.display = (me && me.isAdmin) ? 'none' : 'block';
    resetForm();
    refresh(me);
  }

  $('btnSave').onclick = save;
  $('btnCancel').onclick = resetForm;

  // 上新页 = 岛民（小蓝页 SSO）专用。未登录显示登岛引导；
  // 登录后：站长(isAdmin) 可改/删任意片，普通岛民只能改/删自己发的。
  (async () => {
    const me = await PY.user.load();
    if (!me) { document.getElementById('gate').style.display = 'block'; return; }
    showAdmin(me);
  })();
  PY.showSsoNotice();
  PY.mountHeader();
})();
</script>
</body>
</html>
