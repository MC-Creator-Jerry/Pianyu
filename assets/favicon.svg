<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="片屿">
  <defs>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a5f"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <style>
      .bg { fill: #1a120e; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #fff1e3; }
      }
    </style>
  </defs>

  <!-- 圆角底（暖色深浅主题） -->
  <rect class="bg" x="3" y="3" width="58" height="58" rx="15"/>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="url(#gw)" stroke-width="2.5"/>

  <!-- 落日 -->
  <circle cx="32" cy="25" r="11" fill="url(#gw)"/>

  <!-- 海浪 -->
  <path d="M6 49 q5 -4 10 0 t10 0 t10 0 t10 0 t10 0" fill="none" stroke="url(#gw)" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
  <path d="M10 55 q5 -4 10 0 t10 0 t10 0 t10 0" fill="none" stroke="url(#gw)" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>

  <!-- 小岛：海面上的圆丘 -->
  <path d="M24 50 C27 39 37 39 40 50 Z" fill="url(#gw)"/>
</svg>
